name: New year
# The calendar rails of the delivered collection move on in two steps (builder/new_year.py): on 1 January the
# "right now" windows (Trending: last year + this year), on 1 March the "this year" rails (Top of the Year, Best of
# <year> and its card, Best Documentaries of <year>, the new Most Popular of the Year rail) - the new year has films
# to show by then. Each step rolls library/genre_rails.json too and publishes builder/out/delivered/nuvio-<year>-<ocak|mart>.json
# for Ozzy to import with "Replace". Runs after the Decade art job (06:07 UTC on the 1st) has rendered the new card.
on:
  schedule:
    - cron: "30 7 1 1 *"   # 1 January, 07:30 UTC (10:30 Istanbul)
    - cron: "30 7 1 3 *"   # 1 March, 07:30 UTC
  workflow_dispatch:
    inputs:
      part:
        description: "recent (January) or showcase (March)"
        default: "recent"
      year:
        description: "the new year (default: this year)"
        default: ""
permissions:
  contents: write
concurrency: repo-writes
jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Roll the year
        run: |
          Y="${{ github.event.inputs.year }}"; Y="${Y:-$(date -u +%Y)}"
          P="${{ github.event.inputs.part }}"
          if [ -z "$P" ]; then [ "$(date -u +%m)" = "03" ] && P=showcase || P=recent; fi
          [ "$P" = showcase ] && N="nuvio-$Y-mart.json" || N="nuvio-$Y-ocak.json"
          cd builder
          python3 new_year.py out/delivered/baseline.json "out/$N" "$Y" --part "$P" --rails ../library/genre_rails.json
          bash deliver.sh "$N"
          echo "N=$N" >> "$GITHUB_ENV"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "builder/out/delivered/$N" builder/out/delivered/baseline.json library/genre_rails.json
          git commit -q -m "New year: $N"
          git pull --rebase -X theirs -q && git push -q
