name: Discover Wikidata items (temporary)
on:
  push:
    paths: [data/wikidata.json, scripts/discover_wikidata.py, scripts/wikidata.py, .github/workflows/discover.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/discover_wikidata.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.md
          git commit -m "Wikidata discovery report" || exit 0
          git push
