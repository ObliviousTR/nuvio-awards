name: Parser self-test (temporary)
on:
  push:
    paths: [data/events.json, scripts/wiki_winners.py, scripts/selftest_wiki.py, .github/workflows/selftest.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/selftest_wiki.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/selftest.md
          git commit -m "Parser self-test report" || exit 0
          git push
