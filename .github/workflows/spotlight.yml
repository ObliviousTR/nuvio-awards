name: Spotlight
on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC (06:17 Istanbul)
  workflow_dispatch:
    inputs:
      mode:
        description: "build = normal run, check = test every pool entry (writes spotlight/CHECK.md), redraw = rebuild all art"
        default: build
        type: choice
        options: [build, check, redraw]
      date:
        description: "Pretend today is YYYY-MM-DD (optional, for testing)"
        required: false
permissions:
  contents: write
concurrency: repo-writes
jobs:
  spotlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pillow
      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MODE: ${{ inputs.mode || 'build' }}
          DATE: ${{ inputs.date }}
        run: |
          args=""
          [ "$MODE" = check ] && args="--check"
          [ "$MODE" = redraw ] && args="--redraw"
          [ -n "$DATE" ] && args="$args --date $DATE"
          python3 scripts/spotlight.py $args
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A spotlight
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Spotlight update $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
