name: Turkish titles
# Daily list of Turkish productions with their own names and logos, read by the tr-proxy worker.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-writes
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build trmeta/map.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/tr_titles.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trmeta
          git diff --cached --quiet || git commit -q -m "Turkish titles $(date -u +%F)"
          git pull --rebase -q && git push -q
