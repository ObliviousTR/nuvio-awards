name: Library
on:
  schedule:
    - cron: "41 4 * * 0"   # every Sunday 04:41 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: repo-writes
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pillow numpy
      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/library.py --summary "$RUNNER_TEMP/summary.md"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A library spotlight/cache
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Library update $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs -q && git push
      - name: Open an issue with new additions / candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/summary.md" ]; then
            gh issue create --title "Kütüphane: $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/summary.md"
          fi
